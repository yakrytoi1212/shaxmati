<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess — Шахматы с Ботом</title>
    <style>
        :root {
            --bg-color: #161512;
            --panel-bg: #262421;
            --text-main: #bababa;
            --text-bright: #ffffff;
            --accent: #3692e7;
            --accent-hover: #4ba0f0;
            --sq-light: #dee3e6;
            --sq-dark: #8ca2ad;
            --sq-highlight: rgba(255, 255, 0, 0.45);
            --sq-last-move: rgba(155, 199, 0, 0.41);
            --sq-check: radial-gradient(ellipse at center, rgba(255,0,0,1) 0%, rgba(231,0,0,1) 25%, rgba(169,0,0,0) 89%, rgba(158,0,0,0) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            max-width: 1050px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        /* Шахматная доска */
        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 560px;
            aspect-ratio: 1 / 1;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .square.light { background-color: var(--sq-light); }
        .square.dark { background-color: var(--sq-dark); }
        .square.selected { background-color: rgba(20, 85, 30, 0.5) !important; }
        .square.last-move::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--sq-last-move);
            pointer-events: none;
        }
        .square.in-check {
            background: var(--sq-check) !important;
        }

        /* Подсказки ходов */
        .move-dot {
            width: 28%;
            height: 28%;
            background-color: rgba(20, 85, 30, 0.45);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }

        .capture-ring {
            position: absolute;
            width: 85%;
            height: 85%;
            border: 5px solid rgba(20, 85, 30, 0.45);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }

        /* Координаты */
        .coord {
            position: absolute;
            font-size: 11px;
            font-weight: 700;
            pointer-events: none;
            z-index: 3;
        }
        .coord.rank { top: 2px; left: 4px; }
        .coord.file { bottom: 2px; right: 4px; }
        .square.light .coord { color: var(--sq-dark); }
        .square.dark .coord { color: var(--sq-light); }

        /* Фигуры */
        .piece {
            width: 86%;
            height: 86%;
            z-index: 4;
            transition: transform 0.1s ease;
            pointer-events: none;
        }
        .square:hover .piece {
            transform: scale(1.05);
        }

        /* Боковая панель */
        .sidebar {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-box {
            background-color: #1e1c19;
            padding: 12px 15px;
            border-radius: 6px;
            border-left: 4px solid var(--accent);
            font-weight: 600;
            color: var(--text-bright);
            font-size: 15px;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .thinking-dots {
            display: none;
            color: var(--accent);
            font-size: 13px;
        }
        .thinking-dots.active { display: inline; }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: #999;
            font-weight: 600;
        }

        select, button {
            background-color: #363431;
            color: var(--text-bright);
            border: 1px solid #4a4743;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        select:hover, button:hover {
            background-color: #45423e;
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* История ходов */
        .history-box {
            background-color: #1e1c19;
            border-radius: 6px;
            height: 210px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
        }

        .history-row {
            display: grid;
            grid-template-columns: 35px 1fr 1fr;
            padding: 4px 6px;
            border-radius: 4px;
        }
        .history-row:nth-child(even) { background-color: rgba(255, 255, 255, 0.03); }
        .history-num { color: #777; }
        .history-move { color: var(--text-bright); }

        @media (max-width: 920px) {
            .sidebar { max-width: 560px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="board-wrapper">
        <div id="board" class="board"></div>
    </div>

    <div class="sidebar">
        <div class="header-title">
            <span>♔ Шахматы с Ботом</span>
            <span style="font-size: 12px; color: #888;">v1.0</span>
        </div>

        <div class="status-box">
            <span id="status-text">Ваш ход (Белые)</span>
            <span id="thinking" class="thinking-dots">Бот думает...</span>
        </div>

        <div class="controls-group">
            <label for="difficulty">Уровень сложности бота</label>
            <select id="difficulty">
                <option value="1">Уровень 1 — Новичок</option>
                <option value="2">Уровень 2 — Любитель</option>
                <option value="3" selected>Уровень 3 — Опытный (Рекомендуется)</option>
            </select>
        </div>

        <div class="controls-group">
            <label for="player-color">Играть за</label>
            <select id="player-color" onchange="startNewGame()">
                <option value="w" selected>Белые фигуры</option>
                <option value="b">Черные фигуры</option>
            </select>
        </div>

        <div class="btn-row">
            <button class="btn-primary" onclick="startNewGame()">Новая игра</button>
            <button onclick="undoMove()">↩ Отменить ход</button>
        </div>

        <div class="controls-group">
            <label>Запись партии</label>
            <div id="history" class="history-box"></div>
        </div>
    </div>
</div>

// === ЗВУКОВОЙ СИНТЕЗАТОР (Web Audio API) ===
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
if (audioCtx.state === 'suspended') audioCtx.resume();
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
const now = audioCtx.currentTime;
if (type === 'move') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(160, now);
osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
gain.gain.setValueAtTime(0.25, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
osc.start(now);
osc.stop(now + 0.08);
} else if (type === 'capture') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(220, now);
osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
osc.start(now);
osc.stop(now + 0.12);
} else if (type === 'check') {
osc.type = 'sine';
osc.frequency.setValueAtTime(520, now);
osc.frequency.setValueAtTime(420, now + 0.1);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
osc.start(now);
osc.stop(now + 0.25);
}
}
