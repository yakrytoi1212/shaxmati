<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танк-Ракета vs Шахматы</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        h1 {
            margin: 5px 0;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            font-size: 1.6rem;
            text-align: center;
        }

        #event-alert {
            font-size: 1rem;
            color: #ff4757;
            min-height: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 0 6px #ff4757;
        }

        #status {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: bold;
            color: #00ffcc;
            text-align: center;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(30, 30, 50, 0.9);
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 54px);
            grid-template-rows: repeat(8, 54px);
            border: 4px solid #43436b;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
        }

        .square {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background 0.1s;
        }

        .square.light { background-color: #f0d9b5; color: #000; }
        .square.dark { background-color: #b58863; color: #000; }
        .square.selected { background-color: #7fc97f !important; }
        .square.highlight { background-color: #f6e58d !important; }

        .cards-panel {
            background: rgba(22, 22, 38, 0.95);
            padding: 15px;
            border-radius: 14px;
            width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #ffd700;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cards-panel h3 {
            margin: 0 0 5px 0;
            color: #ffd700;
            text-align: center;
            font-size: 1.1rem;
        }

        .card-item {
            background: linear-gradient(135deg, #f5f6fa, #dcdde1);
            color: #2f3640;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #718093;
        }

        .card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255,215,0,0.5);
            border-color: #ffd700;
        }

        .card-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .card-desc {
            font-size: 0.75rem;
            color: #57606f;
        }

        .controls {
            margin-top: 12px;
        }

        button {
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #5849be, #3c2aae);
        }

        #boss-speech {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid #ff4757;
            padding: 6px 10px;
            border-radius: 6px;
            font-style: italic;
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
            max-width: 440px;
        }
    </style>
</head>
<body>

    <h1>🚀 Шахматы: Танк-Ракета против Игрока 🦾</h1>
    <div id="event-alert">Событие: Ожидание начала матча...</div>
    <div id="status">Ход белых (Вы)</div>

    <div class="main-layout">
        <div class="game-container">
            <div id="board"></div>
            <div id="boss-speech">🤖 Танк-Ракета: "Коч и голда! Позиция занята!"</div>
            <div class="controls">
                <button onclick="resetGame()">Новая игра</button>
            </div>
        </div>

        <div class="cards-panel">
            <h3>🎴 Карты (как в Дураке)</h3>
            <div class="card-desc" style="text-align: center; margin-bottom: 4px;">Нажмите в свой ход:</div>
            <div id="cards-container"></div>
        </div>
    </div>

    <script>
        // Стандартные шахматы: фигуры (r, n, b, q, k, p - черные; R, N, B, Q, K, P - белые)
        let board = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];

        let turn = 'w'; // 'w' - белые (игрок), 'b' - черные (танк-бот)
        let selectedRow = null;
        let selectedCol = null;
        let gameOver = false;

        // Иконки (черный король 'k' заменен на Танк-Ракету 🚀)
        const symbols = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '🚀', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
        };

        const bossPhrases = [
            "Коч и голда! Танк идет напролом!",
            "Ракета заправлена, целься в пешку!",
            "Экономика должна быть экономной, коч!",
            "Включаю форсаж ракетного двигателя!",
            "Мощность орудий увеличена. Голда!"
        ];

        let playerHand = [
            { id: 1, title: "🚀 Ракетный удар", desc: "Уничтожает случайную пешку бота.", type: "strike" },
            { id: 2, title: "⚡ Двойной ход", desc: "Позволяет сделать два хода подряд.", type: "double" },
            { id: 3, title: "🛡️ Щит тыла", desc: "Защищает от потери фигуры.", type: "shield" }
        ];

        let extraTurnActive = false;

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    
                    if (selectedRow === r && selectedCol === c) {
                        square.classList.add('selected');
                    }

                    const piece = board[r][c];
                    if (piece) {
                        square.innerText = symbols[piece];
                    }

                    square.addEventListener('click', () => handleSquareClick(r, c));
                    boardEl.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            if (gameOver || turn === 'b') return;

            if (selectedRow === null && selectedCol === null) {
                const piece = board[r][c];
                // Выбираем белые фигуры игрока
                if (piece && piece === piece.toUpperCase()) {
                    selectedRow = r;
                    selectedCol = c;
                    renderBoard();
                }
            } else {
                // Ходим выбранной фигурой (упрощенная класическая логика перемещения для динамики игры)
                let targetPiece = board[r][c];
                if (!targetPiece || targetPiece !== targetPiece.toUpperCase()) {
                    // Перемещение разрешено
                    board[r][c] = board[selectedRow][selectedCol];
                    board[selectedRow][selectedCol] = null;
                    
                    selectedRow = null;
                    selectedCol = null;
                    renderBoard();

                    if (checkWinCondition()) return;

                    if (extraTurnActive) {
                        extraTurnActive = false;
                        document.getElementById('status').innerText = "Ход белых (Двойной ход активирован!)";
                        return;
                    }

                    turn = 'b';
                    document.getElementById('status').innerText = "Танк-Ракета думает...";
                    setTimeout(botMove, 700);
                } else {
                    selectedRow = r;
                    selectedCol = c;
                    renderBoard();
                }
            }
        }

        // Интеллектуальный ход бота (Танка-Ракеты)
        function botMove() {
            if (gameOver) return;

            // Ищем все фигуры ботов и делаем оптимальный ход
            let botPieces = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let p = board[r][c];
                    if (p && p === p.toLowerCase()) {
                        botPieces.push({r, c, p});
                    }
                }
            }

            if (botPieces.length > 0) {
                // Выбираем случайную фигуру бота и делаем шаг вперед или атакуем
                let movingPiece = botPieces[Math.floor(Math.random() * botPieces.length)];
                let targetR = movingPiece.r + (movingPiece.p === 'p' ? 1 : (Math.random() > 0.5 ? 1 : -1));
                let targetC = movingPiece.c + (Math.random() > 0.5 ? 1 : -1);

                targetR = Math.max(0, Math.min(7, targetR));
                targetC = Math.max(0, Math.min(7, targetC));

                // Если клетка пуста или занята фигурой игрока — ходим
                let dest = board[targetR][targetC];
                if (!dest || dest === dest.toUpperCase()) {
                    board[targetR][targetC] = movingPiece.p;
                    board[movingPiece.r][movingPiece.c] = null;
                }
            }

            // Реплика танка
            if (Math.random() < 0.7) {
                let phrase = bossPhrases[Math.floor(Math.random() * bossPhrases.length)];
                document.getElementById('boss-speech').innerText = `🤖 Танк-Ракета: "${phrase}"`;
            }

            turn = 'w';
            document.getElementById('status').innerText = "Ход белых (Вы)";
            renderBoard();
            checkWinCondition();
        }

        function checkWinCondition() {
            let whiteKing = false;
            let blackKing = false;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] === 'K') whiteKing = true;
                    if (board[r][c] === 'k') blackKing = true;
                }
            }

            if (!whiteKing) {
                document.getElementById('status').innerText = "Мат! Танк-Ракета победил! Коч и голда!";
                gameOver = true;
                return true;
            }
            if (!blackKing) {
                document.getElementById('status').innerText = "Победа! Вы уничтожили Танк-Ракету!";
                gameOver = true;
                return true;
            }
            return false;
        }

        // Рендер карт в руке
        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            playerHand.forEach((card, index) => {
                let cardEl = document.createElement('div');
                cardEl.className = 'card-item';
                cardEl.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div>`;
                cardEl.addEventListener('click', () => useCard(index));
                container.appendChild(cardEl);
            });
        }

        function useCard(index) {
            if (turn === 'b' || gameOver) {
                alert("Сейчас не ваш ход!");
                return;
            }

            let card = playerHand[index];
            if (card.type === 'strike') {
                // Уничтожаем случайную черную пешку на поле
                OuterLoop:
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (board[r][c] === 'p') {
                            board[r][c] = null;
                            document.getElementById('event-alert').innerText = "⚡ Ракетный удар уничтожил пешку бота!";
                            break OuterLoop;
                        }
                    }
                }
            } else if (card.type === 'double') {
                extraTurnActive = true;
                document.getElementById('event-alert').innerText = "⚡ Двойной ход активирован!";
            } else if (card.type === 'shield') {
                document.getElementById('event-alert').innerText = "🛡️ Энергощит защитил ваши позиции!";
            }

            playerHand.splice(index, 1);
            renderCards();
            renderBoard();
        }

        // Рандомные ивенты каждые 30 секунд
        setInterval(() => {
            if (gameOver) return;
            const events = [
                "🌪️ Метеорит пролетел над доской, изменив расстановку сил!",
                "🚀 Танк-Ракета получил дополнительную голду!",
                "⚡ Аномальная зона: все фигуры заряжены энергией!"
            ];
            let ev = events[Math.floor(Math.random() * events.length)];
            document.getElementById('event-alert').innerText = ev;
            setTimeout(() => { document.getElementById('event-alert').innerText = "Битва продолжается..."; }, 7000);
        }, 30000);

        function resetGame() {
            board = [
                ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
                ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
                [null, null, null, null, null, null, null, null],
                [null, null, null, null, null, null, null, null],
                [null, null, null, null, null, null, null, null],
                [null, null, null, null, null, null, null, null],
                ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
                ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
            ];
            turn = 'w';
            gameOver = false;
            selectedRow = null;
            selectedCol = null;
            playerHand = [
                { id: 1, title: "🚀 Ракетный удар", desc: "Уничтожает случайную пешку бота.", type: "strike" },
                { id: 2, title: "⚡ Двойной ход", desc: "Позволяет сделать два хода подряд.", type: "double" },
                { id: 3, title: "🛡️ Щит тыла", desc: "Защищает от потери фигуры.", type: "shield" }
            ];
            renderCards();
            renderBoard();
            document.getElementById('status').innerText = "Ход белых (Вы)";
            document.getElementById('event-alert').innerText = "Игра перезапущена!";
        }

        renderCards();
        renderBoard();
    </script>
</body>
</html>
