<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COSMOS 3D — Симулятор Солнечной Системы</title>
  <style>
    :root {
      --bg: #03050d;
      --glass: rgba(9, 15, 34, 0.72);
      --glass-border: rgba(147, 197, 253, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .brand {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .orb-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fef08a, #f59e0b 65%, #b45309);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.75);
    }

    .brand-name {
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .brand-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .toolbar {
      padding: 8px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    button {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(56, 189, 248, 0.45);
    }

    button.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #7dd3fc;
    }

    .sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* Карточка объекта */
    .inspector {
      position: fixed;
      top: 80px;
      right: 14px;
      width: 332px;
      max-width: calc(100% - 28px);
      padding: 18px;
      z-index: 20;
      opacity: 0;
      transform: translateX(26px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .inspector.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .insp-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .insp-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .insp-title {
      margin: 3px 0 10px;
      font-size: 24px;
      font-weight: 900;
    }

    .insp-desc {
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.55;
      color: #cbd5e1;
    }

    .insp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .metric {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 9px 11px;
    }

    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .metric-val {
      font-size: 12px;
      font-weight: 800;
      margin-top: 3px;
    }

    .insp-fact {
      background: rgba(56, 189, 248, 0.1);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.45;
      color: #e0f2fe;
    }

    /* Нижний док планет */
    .dock-wrap {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 24px);
      z-index: 20;
    }

    .dock {
      padding: 7px 10px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .dock::-webkit-scrollbar {
      display: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      padding: 7px 12px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .fallback-msg {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #050814;
      z-index: 50;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="fallback-msg" id="fallbackMsg">
    <div>
      <h2>Не удалось загрузить 3D-движок Three.js</h2>
      <p style="color:#94a3b8;max-width:420px;">Проверь подключение к интернету — для рендера 3D-сфер и орбит страница подключает библиотеку Three.js с CDN.</p>
    </div>
  </div>

  <div class="hud">
    <div class="panel brand">
      <div class="orb-icon"></div>
      <div>
        <div class="brand-name">COSMOS 3D</div>
        <div class="brand-hint" id="camHint">ЛКМ — орбита · ПКМ — сдвиг · Колёсико — зум · Клик по планете — полёт</div>
      </div>
    </div>

    <div class="panel toolbar">
      <button id="btnPause">⏸ Пауза</button>
      <button class="spd" data-spd="-2">-2x</button>
      <button class="spd active" data-spd="1">1x</button>
      <button class="spd" data-spd="4">4x</button>
      <button class="spd" data-spd="12">12x</button>
      <div class="sep"></div>
      <button id="btnOrbits" class="active">Орбиты</button>
      <button id="btnAsteroids" class="active">Астероиды</button>
      <button id="btnOverview">Обзор</button>
    </div>
  </div>

  <aside class="panel inspector" id="inspector">
    <div class="insp-head">
      <div>
        <div class="insp-tag" id="iTag">ПЛАНЕТА</div>
        <h2 class="insp-title" id="iTitle">Земля</h2>
      </div>
      <button id="btnCloseInsp">✕</button>
    </div>
    <p class="insp-desc" id="iDesc"></p>
    <div class="insp-grid">
      <div class="metric"><div class="metric-label">От Солнца</div><div class="metric-val" id="iDist"></div></div>
      <div class="metric"><div class="metric-label">Год</div><div class="metric-val" id="iYear"></div></div>
      <div class="metric"><div class="metric-label">Температура</div><div class="metric-val" id="iTemp"></div></div>
      <div class="metric"><div class="metric-label">Спутники</div><div class="metric-val" id="iMoons"></div></div>
    </div>
    <div class="insp-fact" id="iFact"></div>
  </aside>

  <div class="dock-wrap">
    <div class="panel dock" id="dock"></div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    if (!window.THREE || !window.THREE.OrbitControls) {
      document.getElementById('fallbackMsg').style.display = 'flex';
      throw new Error('Three.js failed to load');
    }

    const PLANET_DATA = [

        radius: 6.2, orbit: 0, speed: 0, rotSpeed: 0.08, angle: 0,

        desc: 'Раскалённый плазменный центр Солнечной системы, удерживающий на орбитах планеты, кометы и астероиды.',
        fact: 'В ядре Солнца температура достигает ~15 миллионов °C.'
      },

        radius: 1.05, orbit: 12.5, speed: 1.55, rotSpeed: 0.15, angle: 0.7,

        dist: '0.72 а.е.', year: '225 суток', temp: '~+465 °C', moons: '0',

        atmo: 'rgba(56, 189, 248, 0.42)', hasMoon: true,

        desc: 'Планета с жидкими океанами, динамичной атмосферой, тектоникой плит и биосферой.',

      },
      {
        id: 'mars', name: 'Марс', tag: 'Планета земной группы', color: '#f87171',
        radius: 1.4, orbit: 32.5, speed: 0.8, rotSpeed: 0.42, angle: 5.1,
        atmo: 'rgba(248, 113, 113, 0.25)',
        dist: '1.52 а.е.', year: '687 суток', temp: 'сред. -63 °C', moons: '2',
        desc: 'Холодный пустынный мир с оксидом железа в грунте, полярными шапками и гигантскими каньонами.',
        fact: 'Долина Маринер на Марсе тянется более чем на 4 000 км.'
      },
      {
        id: 'jupiter', name: 'Юпитер', tag: 'Газовый гигант', color: '#e0a96d',
        radius: 4.3, orbit: 45, speed: 0.43, rotSpeed: 0.9, angle: 1.3,
        atmo: 'rgba(251, 191, 36, 0.25)',
        dist: '5.20 а.е.', year: '11.86 лет', temp: '~-110 °C', moons: '95',
        desc: 'Гигантская планета из водорода и гелия с полосами облаков, штормами и мощным магнитным полем.',
        fact: 'Юпитер вращается вокруг оси всего за ~10 часов — быстрее всех планет.'
      },
      {
        id: 'saturn', name: 'Сатурн', tag: 'Газовый гигант', color: '#fde047',
        radius: 3.6, orbit: 58.5, speed: 0.29, rotSpeed: 0.82, angle: 2.8,
        tilt: 0.46, rings: true, atmo: 'rgba(254, 240, 138, 0.22)',
        dist: '9.58 а.е.', year: '29.45 лет', temp: '~-140 °C', moons: '146',
        desc: 'Планета с широкой системой колец из миллиардов ледяных и каменистых частиц.',
        fact: 'Спутник Сатурна Титан плотнее других лун и обладает плотной азотной атмосферой.'
      },
      {
        id: 'uranus', name: 'Уран', tag: 'Ледяной гигант', color: '#67e8f9',
        radius: 2.55, orbit: 70.5, speed: 0.2, rotSpeed: -0.55, angle: 4.5,
        tilt: 1.7, atmo: 'rgba(103, 232, 249, 0.3)',
        dist: '19.2 а.е.', year: '84 года', temp: '~-195 °C', moons: '28',
        desc: 'Ледяной гигант с мантией из воды, аммиака и метана и экстремальным наклоном оси вращения.',
        fact: 'Каждый полюс Урана освещён Солнцем 42 земных года подряд, а затем 42 года погружён во тьму.'
      },
      {
        id: 'neptune', name: 'Нептун', tag: 'Ледяной гигант', color: '#60a5fa',
        radius: 2.45, orbit: 81.5, speed: 0.15, rotSpeed: 0.5, angle: 5.9,
        atmo: 'rgba(96, 165, 250, 0.32)',
        dist: '30.05 а.е.', year: '164.8 лет', temp: '~-200 °C', moons: '16',
        desc: 'Дальний синий ледяной гигант с самыми быстрыми ветрами в Солнечной системе.',
        fact: 'Нептун стал первой планетой, открытой благодаря математическим расчётам, а не случайному наблюдению.'
      }
    ];

    function makePlanetTexture(id) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const g = c.getContext('2d');

      if (id === 'sun') {
        const grad = g.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0, '#f97316');
        grad.addColorStop(0.5, '#facc15');
        grad.addColorStop(1, '#ea580c');
        g.fillStyle = grad;
        g.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 420; i++) {
          g.fillStyle = i % 2 === 0 ? 'rgba(255,250,210,0.22)' : 'rgba(180,50,0,0.16)';
          g.beginPath();
          g.ellipse(Math.random() * 512, Math.random() * 256, 8 + Math.random() * 18, 4 + Math.random() * 9, 0, 0, Math.PI * 2);
          g.fill();
        }
      } else if (id === 'earth') {
        g.fillStyle = '#1d4ed8';
        g.fillRect(0, 0, 512, 256);
        // Материки
        g.fillStyle = '#16a34a';
        const lands = [
          [90, 75, 55, 35], [120, 125, 38, 52], [260, 70, 75, 42],
          [285, 120, 48, 46], [390, 95, 50, 32], [60, 225, 390, 32]
        ];
        lands.forEach(([x, y, rx, ry]) => {
          g.beginPath();
          g.ellipse(x, y, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
          g.fill();
        });
        // Облака
        g.fillStyle = 'rgba(255,255,255,0.45)';
        for (let i = 0; i < 48; i++) {
          g.beginPath();
          g.ellipse(Math.random() * 512, Math.random() * 256, 16 + Math.random() * 28, 4 + Math.random() * 7, 0, 0, Math.PI * 2);
          g.fill();
        }
      } else if (id === 'jupiter') {
        const bands = ['#d9b382', '#9a5b32', '#f3dec0', '#b86b35', '#e6c69c', '#7c4422', '#edd4b2'];
        bands.forEach((col, idx) => {
          g.fillStyle = col;
          g.fillRect(0, (idx / bands.length) * 256, 512, 256 / bands.length + 2);
        });
        // Большое красное пятно
        g.fillStyle = 'rgba(194, 65, 38, 0.85)';
        g.beginPath();
        g.ellipse(320, 155, 28, 16, 0, 0, Math.PI * 2);
        g.fill();
      } else if (id === 'saturn') {
        const sBands = ['#f5e3b3', '#dec082', '#efe0b8', '#c8a668', '#f2e1b6'];
        sBands.forEach((col, idx) => {
          g.fillStyle = col;
          g.fillRect(0, (idx / sBands.length) * 256, 512, 256 / sBands.length + 2);
        });
      } else if (id === 'mars') {
        g.fillStyle = '#c2410c';
        g.fillRect(0, 0, 512, 256);
        g.fillStyle = 'rgba(124, 45, 18, 0.55)';
        for (let i = 0; i < 36; i++) {
          g.beginPath();
          g.ellipse(Math.random() * 512, Math.random() * 256, 14 + Math.random() * 26, 8 + Math.random() * 14, 0, 0, Math.PI * 2);
          g.fill();
        }
        g.fillStyle = 'rgba(255,255,255,0.75)';
        g.fillRect(0, 0, 512, 14);
        g.fillRect(0, 242, 512, 14);
      } else if (id === 'venus') {
        g.fillStyle = '#eab308';
        g.fillRect(0, 0, 512, 256);
        g.fillStyle = 'rgba(254, 249, 195, 0.35)';
        for (let i = 0; i < 26; i++) {
          g.fillRect(0, Math.random() * 256, 512, 6 + Math.random() * 12);
        }
      } else if (id === 'uranus') {
        g.fillStyle = '#22d3ee';
        g.fillRect(0, 0, 512, 256);
        g.fillStyle = 'rgba(165, 243, 252, 0.25)';
        g.fillRect(0, 60, 512, 22);
        g.fillRect(0, 165, 512, 18);
      } else if (id === 'neptune') {
        g.fillStyle = '#1d4ed8';
        g.fillRect(0, 0, 512, 256);
        g.fillStyle = 'rgba(96, 165, 250, 0.25)';
        for (let i = 0; i < 18; i++) {
          g.fillRect(0, Math.random() * 256, 512, 5 + Math.random() * 10);
        }
      } else {
        // Меркурий
        g.fillStyle = '#8b8580';
        g.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 70; i++) {
          g.fillStyle = i % 2 === 0 ? 'rgba(60,56,54,0.45)' : 'rgba(214,211,209,0.22)';
          g.beginPath();
          g.arc(Math.random() * 512, Math.random() * 256, 2 + Math.random() * 8, 0, Math.PI * 2);
          g.fill();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeRingTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 32;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 512, 0);
      grad.addColorStop(0.0, 'rgba(253,224,71,0.0)');
      grad.addColorStop(0.15, 'rgba(253,224,71,0.55)');
      grad.addColorStop(0.45, 'rgba(254,249,195,0.85)');
      grad.addColorStop(0.52, 'rgba(0,0,0,0.05)');
      grad.addColorStop(0.62, 'rgba(234,179,8,0.65)');
      grad.addColorStop(0.9, 'rgba(253,224,71,0.35)');
      grad.addColorStop(1.0, 'rgba(253,224,71,0.0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 512, 32);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#03050d');

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.2, 1200);
    camera.position.set(0, 68, 125);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 4;
    controls.maxDistance = 320;
    controls.panSpeed = 0.8;
    controls.rotateSpeed = 0.75;

    // Свет
    const ambient = new THREE.AmbientLight('#94a3b8', 0.45);
    scene.add(ambient);
    const sunLight = new THREE.PointLight('#fff3c4', 4.5, 420, 0.45);
    scene.add(sunLight);

    // Звёздное поле
    const starCount = 3200;
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    const palette = [new THREE.Color('#ffffff'), new THREE.Color('#bae6fd'), new THREE.Color('#fde68a'), new THREE.Color('#ddd6fe')];

    for (let i = 0; i < starCount; i++) {
      const r = 240 + Math.random() * 420;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() -
