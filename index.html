<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы: Танк-Ракета Путин vs Игрок</title>
    <!-- Подключаем надежную шахматную библиотеку для правильных ходов всех фигур -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #12121f, #221f3b);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        h1 {
            margin: 5px 0;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            font-size: 1.5rem;
            text-align: center;
        }

        #event-alert {
            font-size: 0.95rem;
            color: #ff4757;
            min-height: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2px;
        }

        #status {
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: #00ffcc;
            text-align: center;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(35, 35, 55, 0.9);
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 56px);
            grid-template-rows: repeat(8, 56px);
            border: 4px solid #48486d;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
        }

        .square {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background 0.1s;
        }

        .square.light { background-color: #ebecd0; color: #000; }
        .square.dark { background-color: #739552; color: #000; }
        .square.selected { background-color: #baca2b !important; }
        .square.possible-move::after {
            content: '';
            width: 16px;
            height: 16px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
        }

        .cards-panel {
            background: rgba(25, 25, 42, 0.95);
            padding: 15px;
            border-radius: 14px;
            width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #ffcc00;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cards-panel h3 {
            margin: 0 0 5px 0;
            color: #ffcc00;
            text-align: center;
            font-size: 1.1rem;
        }

        .card-item {
            background: linear-gradient(135deg, #f5f6fa, #dcdde1);
            color: #2f3640;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #718093;
        }

        .card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255,204,0,0.5);
            border-color: #ffcc00;
        }

        .card-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .card-desc {
            font-size: 0.75rem;
            color: #57606f;
        }

        .controls {
            margin-top: 12px;
        }

        button {
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #5849be, #3c2aae);
        }

        #boss-speech {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            color: #ff6b81;
            margin-top: 10px;
            text-align: center;
            font-size: 0.95rem;
            max-width: 440px;
            text-shadow: 0 0 5px rgba(255, 71, 87, 0.5);
        }
    </style>
</head>
<body>

            <div id="board"></div>
            <div id="boss-speech">💬 Путин: "КОЧ И ГОЛДА! Сделай свой ход!"</div>
            <div class="controls">
                <button onclick="resetGame()">Новая игра</button>
            </div>
        </div>

            <div id="cards-container"></div>
        </div>
    </div>
