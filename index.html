<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Космос — Симулятор Солнечной системы</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040711;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #canvas.grabbing {
      cursor: grabbing;
    }

    .hud-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: rgba(10, 16, 34, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .title-box {
      padding: 8px 14px;
    }

    .title-main {
      font-weight: 800;
      font-size: 14px;
    }

    .title-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button.active {
      background: rgba(45, 212, 191, 0.22);
      border-color: #2dd4bf;
      color: #5eead4;
    }

    .planet-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: calc(100% - 24px);
    }

    .planet-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 7px 10px;
      background: rgba(10, 16, 34, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }

    .p-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .card {
      position: fixed;
      top: 74px;
      right: 12px;
      width: 310px;
      max-width: calc(100% - 24px);
      background: rgba(10, 16, 34, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 16px;
      padding: 16px;
      z-index: 20;
      display: none;
      backdrop-filter: blur(12px);
    }

    .card.open {
      display: block;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-kind {
      font-size: 11px;
      color: #5eead4;
      font-weight: 800;
      text-transform: uppercase;
    }

    .card-title {
      margin: 2px 0 8px;
      font-size: 22px;
      font-weight: 900;
    }

    .card-desc {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #cbd5e1;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cell {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .cell-k {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .cell-v {
      font-size: 12px;
      font-weight: 800;
      margin-top: 2px;
    }

    .card-fact {
      background: rgba(45, 212, 191, 0.1);
      border-left: 3px solid #2dd4bf;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud-top">
    <div class="panel title-box">
      <div class="title-main">СИМУЛЯТОР КОСМОСА</div>
      <div class="title-sub" id="statusText">ЛКМ — тянуть · Колёсико — зум · Клик по планете — фокус</div>
    </div>

    <div class="panel">
      <button id="btnPause">⏸ Пауза</button>
      <button class="spd active" data-spd="1">1x</button>
      <button class="spd" data-spd="4">4x</button>
      <button class="spd" data-spd="12">12x</button>
      <button id="btnOrbits" class="active">Орбиты</button>
      <button id="btnLabels" class="active">Имена</button>
      <button id="btnReset">Центр</button>
    </div>
  </div>

  <div class="card" id="card">
    <div class="card-top">
      <div>
        <div class="card-kind" id="cKind"></div>
        <h2 class="card-title" id="cTitle"></h2>
      </div>
      <button id="btnCloseCard">✕</button>
    </div>
    <p class="card-desc" id="cDesc"></p>
    <div class="card-grid">
      <div class="cell"><div class="cell-k">От Солнца</div><div class="cell-v" id="cDist"></div></div>
      <div class="cell"><div class="cell-k">Год</div><div class="cell-v" id="cYear"></div></div>
      <div class="cell"><div class="cell-k">Температура</div><div class="cell-v" id="cTemp"></div></div>
      <div class="cell"><div class="cell-k">Спутники</div><div class="cell-v" id="cMoons"></div></div>
    </div>
    <div class="card-fact" id="cFact"></div>
  </div>

  <div class="planet-bar">
    <div class="planet-list" id="planetList"></div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      const BODIES = [
        {
          id: 'sun', name: 'Солнце', kind: 'Звезда', color: '#fbbf24',
          grad: ['#fffbeb', '#fbbf24', '#ea580c'], r: 34, orbit: 0, speed: 0, angle: 0,
          dist: '0 а.е.', year: '—', temp: '~5 500 °C', moons: '8 планет',
          desc: 'Центр нашей системы — огромный шар из горячей плазмы.',
          fact: 'Свет от Солнца долетает до Земли примерно за 8 минут 20 секунд.'
        },
        {
          id: 'mercury', name: 'Меркурий', kind: 'Планета', color: '#a8a29e',
          grad: ['#e7e5e4', '#a8a29e', '#57534e'], r: 6, orbit: 72, speed: 1.6, angle: 0.5,
          dist: '0.39 а.е.', year: '88 дней', temp: '-180..+430 °C', moons: '0',
          desc: 'Самая близкая к Солнцу планета, покрытая кратерами.',
          fact: 'На Меркурии почти нет атмосферы, поэтому тепло там не удерживается.'
        },
        {
          id: 'venus', name: 'Венера', kind: 'Планета', color: '#facc15',
          grad: ['#fef9c3', '#eab308', '#a16207'], r: 10, orbit: 108, speed: 1.15, angle: 1.8,
          dist: '0.72 а.е.', year: '225 дней', temp: '~+465 °C', moons: '0',
          desc: 'Самая жаркая планета системы под плотными облаками.',
          fact: 'День на Венере длится дольше её года вокруг Солнца.'
        },
        {
          id: 'earth', name: 'Земля', kind: 'Планета', color: '#38bdf8',
          grad: ['#bae6fd', '#2563eb', '#15803d'], r: 11, orbit: 150, speed: 1.0, angle: 3.1,
          dist: '1.00 а.е.', year: '365 дней', temp: 'сред. +15 °C', moons: '1 (Луна)',
          desc: 'Наш дом с океанами, атмосферой и жизнью.',
          fact: 'Около 71% поверхности Земли занимает вода.'
        },
        {
          id: 'mars', name: 'Марс', kind: 'Планета', color: '#f87171',
          grad: ['#fecaca', '#dc2626', '#7f1d1d'], r: 8.5, orbit: 192, speed: 0.8, angle: 4.4,
          dist: '1.52 а.е.', year: '687 дней', temp: 'сред. -63 °C', moons: '2',
          desc: 'Красная планета с пустынями, каньонами и вулканами.',
          fact: 'Вулкан Олимп на Марсе почти втрое выше Эвереста.'
        },
        {
          id: 'jupiter', name: 'Юпитер', kind: 'Газовый гигант', color: '#e0a96d',
          grad: ['#fef3c7', '#d97706', '#78350f'], r: 22, orbit: 262, speed: 0.45, angle: 5.2,
          dist: '5.20 а.е.', year: '11.9 лет', temp: '~-110 °C', moons: '95',
          desc: 'Самая большая планета Солнечной системы.',
          fact: 'Юпитер тяжелее всех остальных планет вместе взятых более чем в 2 раза.'
        },
        {
          id: 'saturn', name: 'Сатурн', kind: 'Газовый гигант', color: '#fde047',
          grad: ['#fef9c3', '#ca8a04', '#713f12'], r: 18, orbit: 336, speed: 0.3, angle: 2.3,
          rings: true, dist: '9.58 а.е.', year: '29.5 лет', temp: '~-140 °C', moons: '146',
          desc: 'Газовый гигант с яркими ледяными кольцами.',
          fact: 'Кольца Сатурна в ширину десятки тысяч километров, но сравнительно тонкие.'
        },
        {
          id: 'uranus', name: 'Уран', kind: 'Ледяной гигант', color: '#67e8f9',
          grad: ['#cffafe', '#06b6d4', '#155e75'], r: 14, orbit: 404, speed: 0.2, angle: 0.9,
          dist: '19.2 а.е.', year: '84 года', temp: '~-195 °C', moons: '28',
          desc: 'Бирюзовый ледяной гигант, вращающийся как бы на боку.',
          fact: 'Наклон оси Урана составляет около 98°.'
        },
        {
          id: 'neptune', name: 'Нептун', kind: 'Ледяной гигант', color: '#60a5fa',
          grad: ['#dbeafe', '#2563eb', '#1e3a8a'], r: 13.5, orbit: 464, speed: 0.15, angle: 3.9,
          dist: '30.1 а.е.', year: '165 лет', temp: '~-200 °C', moons: '16',
          desc: 'Дальняя синяя планета с мощными ветрами.',
          fact: 'Скорость ветра на Нептуне превышает 2 000 км/ч.'
        }
      ];

      const stars = Array.from({ length: 300 }, () => ({
        x: Math.random(),
        y: Math.random(),
        r: 0.6 + Math.random() * 1.5,
        a: 0.3 + Math.random() * 0.7
      }));

      let w = window.innerWidth;
      let h = window.innerHeight;

      function fitCanvas() {
        w = window.innerWidth || 800;
        h = window.innerHeight || 600;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      fitCanvas();
      window.addEventListener('resize', fitCanvas);

      let camX = 0;
      let camY = 0;
      let zoom = 0.95;
      let paused = false;
      let speed = 1;
      let showOrbits = true;
      let showLabels = true;
      let selectedId = null;

      const coords = {};
      function stepSim(dt) {
        for (const b of BODIES) {
          if (!paused && b.orbit > 0) {
            b.angle += b.speed * 0.25 * dt * speed;
          }
          coords[b.id] = {
            x: Math.cos(b.angle) * b.orbit,
            y: Math.sin(b.angle) * b.orbit
          };
        }
        if (selectedId && coords[selectedId]) {
          camX += (coords[selectedId].x - camX) * Math.min(1, dt * 8);
          camY += (coords[selectedId].y - camY) * Math.min(1, dt * 8);
        }
      }
      stepSim(0);

      function toScreen(wx, wy) {
        return {
          x: w * 0.5 + (wx - camX) * zoom,
          y: h * 0.5 + (wy - camY) * zoom
        };
      }

      function toWorld(sx, sy) {
        return {
          x: (sx - w * 0.5) / zoom + camX,
          y: (sy - h * 0.5) / zoom + camY
        };
      }

      // UI
      const card = document.getElementById('card');
      const statusText = document.getElementById('statusText');
      const planetList = document.getElementById('planetList');

      function selectBody(id) {
        selectedId = id;
        document.querySelectorAll('.p-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.id === id);
        });
        if (!id) {
          card.classList.remove('open');
          statusText.textContent = 'ЛКМ — тянуть · Колёсико — зум · Клик по планете — фокус';
          return;
        }
        const b = BODIES.find(x => x.id === id);
        if (!b) return;
        document.getElementById('cKind').textContent = b.kind;
        document.getElementById('cTitle').textContent = b.name;
        document.getElementById('cDesc').textContent = b.desc;
        document.getElementById('cDist').textContent = b.dist;
        document.getElementById('cYear').textContent = b.year;
        document.getElementById('cTemp').textContent = b.temp;
        document.getElementById('cMoons').textContent = b.moons;
        document.getElementById('cFact').textContent = '💡 ' + b.fact;
        card.classList.add('open');
        statusText.textContent = `Фокус: ${b.name} · Зум ${zoom.toFixed(1)}x`;
      }

      BODIES.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'p-btn';
        btn.dataset.id = b.id;
        btn.innerHTML = `<span class="dot" style="background:${b.color}"></span>${b.name}`;
        btn.addEventListener('click', () => {
          selectBody(b.id);
          if (zoom < 1.25) zoom = 1.35;
        });
        planetList.appendChild(btn);
      });

      document.getElementById('btnCloseCard').addEventListener('click', () => selectBody(null));

      document.getElementById('btnPause').addEventListener('click', (e) => {
        paused = !paused;
        e.currentTarget.textContent = paused ? '▶ Пуск' : '⏸ Пауза';
        e.currentTarget.classList.toggle('active', paused);
      });

      document.querySelectorAll('.spd').forEach(btn => {
        btn.addEventListener('click', () => {
          speed = Number(btn.dataset.spd);
          paused = false;
          const pBtn = document.getElementById('btnPause');
          pBtn.textContent = '⏸ Пауза';
          pBtn.classList.remove('active');
          document.querySelectorAll('.spd').forEach(x => x.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      document.getElementById('btnOrbits').addEventListener('click', (e) => {
        showOrbits = !showOrbits;
        e.currentTarget.classList.toggle('active', showOrbits);
      });

      document.getElementById('btnLabels').addEventListener('click', (e) => {
        showLabels = !showLabels;
        e.currentTarget.classList.toggle('active', showLabels);
      });

      document.getElementById('btnReset').addEventListener('click', () => {
        camX = 0;
        camY = 0;
        zoom = 0.95;
        selectBody(null);
      });

      // Мышь / тач
      let dragging = false;
      let moved = false;
      let sx = 0, sy = 0, scx = 0, scy = 0;

      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        moved = false;
        sx = e.clientX;
        sy = e.clientY;
        scx = camX;
        scy = camY;
        canvas.classList.add('grabbing');
      });

      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - sx;
        const dy = e.clientY - sy;
        if (Math.hypot(dx, dy) > 4) {
          moved = true;
          if (selectedId) {
            selectedId = null;
            document.querySelectorAll('.p-btn').forEach(btn => btn.classList.remove('active'));
            statusText.textContent = 'Свободный обзор · Колёсико — зум';
          }
        }
        camX = scx - dx / zoom;
        camY = scy - dy / zoom;
      });

      window.addEventListener('pointerup', (e) => {
        if (!dragging) return;
        dragging = false;
        canvas.classList.remove('grabbing');
        if (!moved) {
          const wp = toWorld(e.clientX, e.clientY);
          for (let i = BODIES.length - 1; i >= 0; i--) {
            const b = BODIES[i];
            const c = coords[b.id];
            const hit = Math.max(b.r + 8 / zoom, 12 / zoom);
            if (Math.hypot(wp.x - c.x, wp.y - c.y) <= hit) {
              selectBody(b.id);
              if (zoom < 1.25) zoom = 1.35;
              break;
            }
          }
        }
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoom = Math.max(0.35, Math.min(4, zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
      }, { passive: false });

      function render() {
        ctx.fillStyle = '#040711';
        ctx.fillRect(0, 0, w, h);

        for (const s of stars) {
          ctx.fillStyle = `rgba(226, 232, 240, ${s.a})`;
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        const sunPos = toScreen(0, 0);
        if (showOrbits) {
          for (const b of BODIES) {
            if (!b.orbit) continue;
            ctx.strokeStyle = b.id === selectedId
              ? 'rgba(94, 234, 212, 0.55)'
              : 'rgba(148, 163, 184, 0.16)';
            ctx.lineWidth = b.id === selectedId ? 1.8 : 1;
            ctx.beginPath();
            ctx.arc(sunPos.x, sunPos.y, b.orbit * zoom, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        for (const b of BODIES) {
          const c = coords[b.id];
          const p = toScreen(c.x, c.y);
          const r = Math.max(3, b.r * zoom);

          if (b.id === 'sun') {
            const glow = ctx.createRadialGradient(p.x, p.y, r * 0.4, p.x, p.y, r * 2.5);
            glow.addColorStop(0, 'rgba(251, 191, 36, 0.45)');
            glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2);
            ctx.fill();
          }

          if (b.rings) {
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.65)';
            ctx.lineWidth = Math.max(2, 4 * zoom);
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, r * 2.0, r * 0.55, -0.3, 0, Math.PI * 2);
            ctx.stroke();
          }

          const g = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, r * 0.1, p.x, p.y, r);
          g.addColorStop(0, b.grad[0]);
          g.addColorStop(0.6, b.grad[1]);
          g.addColorStop(1, b.grad[2]);

          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();

          if (b.id === selectedId) {
            ctx.strokeStyle = '#5eead4';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 6, 0, Math.PI * 2);
            ctx.stroke();
          }

          if (showLabels) {
            ctx.font = '700 12px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = b.id === selectedId ? '#5eead4' : '#e2e8f0';
            ctx.fillText(b.name, p.x, p.y + r + 14);
          }
        }
      }

      let prev = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - prev) / 1000);
        prev = now;
        stepSim(dt);
        render();
        requestAnimationFrame(frame);
      }

      render();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
