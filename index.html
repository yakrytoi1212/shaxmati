<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классические шахматы с ботом</title>
    <!-- Подключаем библиотеку шахматной логики (chess.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            color: #f0f0f5;
        }

        #status {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #a29bfe;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2d2d44;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #44445c;
            border-radius: 4px;
            overflow: hidden;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .square.light {
            background-color: #ebecd0;
            color: #000;
        }

        .square.dark {
            background-color: #739552;
            color: #000;
        }

        .square.selected {
            background-color: #baca2b !important;
        }

        .square.possible-move::after {
            content: '';
            width: 18px;
            height: 18px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            position: absolute;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #5849be;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Шахматы</h1>
        <div id="status">Ход белых (Вы)</div>
        <div id="board"></div>
        <div class="controls">
            <button onclick="resetGame()">Новая игра</button>
        </div>
    </div>

    <script>
        let boardElement = document.getElementById('board');
        let statusElement = document.getElementById('status');
        
        let game = new Chess();
        let selectedSquare = null;
        let possibleMoves = [];

        // Символы шахматных фигур
        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function renderBoard() {
            boardElement.innerHTML = '';
            let boardData = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let squareId = String.fromCharCode(97 + c) + (8 - r);
                    let squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareId;

                    let piece = boardData[r][c];
                    if (piece) {
                        squareDiv.innerText = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                    }

                    // Подсветка выбранной клетки
                    if (selectedSquare === squareId) {
                        squareDiv.classList.add('selected');
                    }

                    // Подсветка возможных ходов
                    if (possibleMoves.includes(squareId)) {
                        squareDiv.classList.add('possible-move');
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareId));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateStatus();
        }

        function handleSquareClick(squareId) {
            // Если ход черных (бота), игнорируем клики
            if (game.turn() === 'b') return;

            if (selectedSquare === null) {
                // Выбор фигуры
                let piece = game.get(squareId);
                if (piece && piece.color === 'w') {
                    selectedSquare = squareId;
                    // Получаем допустимые ходы для этой клетки
                    let moves = game.moves({ square: squareId, verbose: true });
                    possibleMoves = moves.map(m => m.to);
                    renderBoard();
                }
            } else {
                // Ход фигурой
                let move = game.move({
                    from: selectedSquare,
                    to: squareId,
                    promotion: 'q' // Автоматическое превращение пешки в ферзя
                });

                selectedSquare = null;
                possibleMoves = [];

                if (move) {
                    renderBoard();
                    // Ход бота через небольшую паузу
                    if (!game.game_over()) {
                        statusStatusThinking();
                        setTimeout(makeBotMove, 500);
                    }
                } else {
                    // Если кликнули на другую свою фигуру — перевыбираем
                    let piece = game.get(squareId);
                    if (piece && piece.color === 'w') {
                        selectedSquare = squareId;
                        let moves = game.moves({ square: squareId, verbose: true });
                        possibleMoves = moves.map(m => m.to);
                    } else {
                        selectedSquare = null;
                        possibleMoves = [];
                    }
                    renderBoard();
                }
            }
        }

        function makeBotMove() {
            if (game.game_over()) return;

            let moves = game.moves({ verbose: true });
            if (moves.length > 0) {
                // Простой бот делает случайный легальный ход
                let randomMove = moves[Math.floor(Math.random() * moves.length)];
                game.move(randomMove);
            }
            renderBoard();
        }

        function updateStatus() {
            let status = '';
            let turn = game.turn() === 'w' ? 'Белые (Вы)' : 'Черные (Бот)';

            if (game.in_checkmate()) {
                status = `Мат! Игра окончена. Победили ${game.turn() === 'w' ? 'Черные' : 'Белые'}!`;
            } else if (game.in_draw()) {
                status = 'Ничья!';
            } else {
                status = `Ход: ${turn}`;
                if (game.in_check()) {
                    status += ' (Шах!)';
                }
            }
            statusElement.innerText = status;
        }

        function statusStatusThinking() {
            statusElement.innerText = 'Бот думает...';
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
        }

        // Первичный запуск отрисовки доски
        renderBoard();
    </script>
</body>
</html>
