<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>СУПЕР ПОП-КЛИКЕР — Roblox Style</title>
  <style>
    :root {
      --bg1: #181038;
      --bg2: #0d1b3e;
      --card: rgba(25, 22, 58, 0.86);
      --card-hover: rgba(42, 36, 92, 0.95);
      --border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --muted: #b4b0d9;
      --yellow: #ffd426;
      --pink: #ff3b8d;
      --cyan: #18f2e5;
      --green: #38ef7d;
      --purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 59, 141, 0.25), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(24, 242, 229, 0.22), transparent 42%),
        linear-gradient(155deg, var(--bg1), var(--bg2));
      padding: 16px;
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: var(--card);
      border: 2px solid var(--border);
      border-bottom-width: 5px;
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stat-val {
      font-size: 24px;
      font-weight: 900;
      margin-top: 2px;
    }

    .val-coins { color: var(--yellow); }
    .val-dps { color: var(--cyan); }
    .val-rebirth { color: var(--pink); }
    .val-luck { color: var(--green); }

    .layout {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.05fr 1.25fr;
      gap: 18px;
      align-items: start;
    }

    /* Левая колонка: Арена кликов и персонаж */
    .click-stage {
      position: relative;
      background: var(--card);
      border: 2px solid var(--border);
      border-bottom-width: 6px;
      border-radius: 26px;
      padding: 24px;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .fever-banner {
      display: none;
      margin: 8px auto 12px;
      padding: 8px 16px;
      border-radius: 14px;
      background: linear-gradient(90deg, #ff3b8d, #ffd426, #ff3b8d);
      color: #150b24;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.04em;
      animation: pulse 0.7s infinite alternate;
    }

    .fever-banner.active {
      display: inline-block;
    }

    @keyframes pulse {
      from { transform: scale(0.98); }
      to { transform: scale(1.03); }
    }

    .pet-arena {
      position: relative;
      height: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 6px 0 14px;
    }

    /* Весёлый персонаж в стиле Roblox-блоба */
    .character-btn {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 44px;
      border: 4px solid rgba(255, 255, 255, 0.35);
      border-bottom-width: 10px;
      background: linear-gradient(145deg, #ff6ec7, #7873f5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 18px 35px rgba(120, 115, 245, 0.45),
        inset 0 8px 16px rgba(255, 255, 255, 0.35);
      transition: transform 0.08s ease;
    }

    .character-btn:hover {
      filter: brightness(1.05);
    }

    .character-btn:active,
    .character-btn.squish {
      transform: scale(0.91, 1.07);
    }

    /* Весёлая шапочка персонажа */
    .hat {
      position: absolute;
      top: -26px;
      width: 96px;
      height: 30px;
      background: var(--yellow);
      border: 3px solid #1e163d;
      border-radius: 16px 16px 6px 6px;
      transform: rotate(-7deg);
    }

    .hat::after {
      content: "";
      position: absolute;
      top: -12px;
      left: 36px;
      width: 20px;
      height: 14px;
      background: var(--pink);
      border: 3px solid #1e163d;
      border-radius: 50%;
    }

    .face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .eyes {
      display: flex;
      gap: 28px;
    }

    .eye {
      width: 26px;
      height: 32px;
      background: #141029;
      border-radius: 50%;
      position: relative;
      transition: transform 0.1s ease, height 0.1s ease;
    }

    .eye::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 6px;
      width: 9px;
      height: 9px;
      background: #fff;
      border-radius: 50%;
    }

    .mouth {
      width: 44px;
      height: 22px;
      background: #141029;
      border-radius: 6px 6px 24px 24px;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s ease;
    }

    .tongue {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 12px;
      background: #ff5d8f;
      border-radius: 10px 10px 0 0;
    }

    .character-btn.excited .mouth {
      transform: scale(1.22);
    }

    .character-name {
      margin-top: 14px;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.03em;
    }

    .character-phrase {
      font-size: 13px;
      color: var(--cyan);
      min-height: 18px;
      margin-top: 2px;
      font-weight: 700;
    }

    .floating-text {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: 20px;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
      animation: floatUp 0.75s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.85); }
      40% { opacity: 1; transform: translate(-50%, -26px) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -62px) scale(0.95); }
    }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-rebirth {
      background: linear-gradient(135deg, #ff3b8d, #a855f7);
      color: #fff;
      border: none;
      border-bottom: 4px solid #6d1b7b;
      border-radius: 16px;
      padding: 12px 20px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .btn-rebirth:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .btn-rebirth:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Правая колонка: Ветка прокачки */
    .upgrades-panel {
      background: var(--card);
      border: 2px solid var(--border);
      border-bottom-width: 6px;
      border-radius: 26px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid transparent;
      color: var(--muted);
      padding: 10px 8px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: rgba(24, 242, 229, 0.14);
      border-color: var(--cyan);
      color: #fff;
    }

    .branch-desc {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 14px;
    }

    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .upg-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .upg-card:hover {
      background: var(--card-hover);
      transform: translateX(2px);
    }

    .upg-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .upg-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .upg-title {
      font-weight: 900;
      font-size: 15px;
    }

    .upg-lvl {
      font-size: 12px;
      color: var(--cyan);
      font-weight: 800;
      margin-left: 6px;
    }

    .upg-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-buy {
      background: linear-gradient(135deg, var(--yellow), #ff9f1c);
      color: #19102b;
      border: none;
      border-bottom: 4px solid #b86b00;
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      min-width: 112px;
      transition: transform 0.08s ease;
    }

    .btn-buy:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-buy:disabled {
      background: rgba(255, 255, 255, 0.09);
      color: var(--muted);
      border-bottom-color: transparent;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: repeat(2, 1fr);
      }
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="stat-box">
      <div class="stat-label">Поп-монеты</div>
      <div class="stat-val val-coins" id="coins">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">В секунду (DPS)</div>
      <div class="stat-val val-dps" id="dps">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Перерождения</div>
      <div class="stat-val val-rebirth" id="rebirths">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Крит / Удача</div>
      <div class="stat-val val-luck" id="critInfo">10% · x3</div>
    </div>
  </div>

  <div class="layout">
    <div class="click-stage">
      <div class="stage-header">
        <span class="badge" id="perClickBadge">+1 за клик</span>
        <span class="badge" id="feverGaugeBadge">Лихорадка: 0%</span>
      </div>

      <div class="fever-banner" id="feverBanner">🔥 ЗОЛОТАЯ ЛИХОРАДКА x2 К ДОХОДУ! 🔥</div>

      <div class="pet-arena" id="arena">
        <button class="character-btn" id="mainBtn" aria-label="Кликнуть по персонажу">
          <div class="hat"></div>
          <div class="face">
            <div class="eyes">
              <div class="eye" id="eyeL"></div>
              <div class="eye" id="eyeR"></div>
            </div>
            <div class="mouth">
              <div class="tongue"></div>
            </div>
          </div>
        </button>
        <div class="character-name">БОББИ-ПОП</div>
        <div class="character-phrase" id="phrase">Жми на меня, пока я не лопнул от счастья!</div>
      </div>

      <div class="action-row">
        <button class="btn-rebirth" id="rebirthBtn" disabled>
          ♻️ Перерождение (нужно 5 000)
        </button>
        <button class="btn-reset" id="resetBtn">Сброс сейва</button>
      </div>
    </div>

    <div class="upgrades-panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="click">💪 Сила клика</button>
        <button class="tab-btn" data-tab="pets">🐾 Питомцы</button>
        <button class="tab-btn" data-tab="luck">⚡ Удача и буст</button>
      </div>
      <p class="branch-desc" id="branchDesc">Качай силу удара и множители каждого тапа.</p>
      <div class="upgrade-list" id="upgradeList"></div>
    </div>
  </div>

  <script>
    const PHRASES = [
      'Ещё-ещё! Монетки сами не накликются!',
      'Ой, щекотно! Дай ещё один крит!',
      'В Роблоксе уже бы завидовали такому темпу!',
      'Мощный тап! Прямо в яблочко!',
      'Копи на перерождение — станет ещё веселее!'
    ];

    const BRANCH_INFO = {
      click: 'Ветка «Сила клика»: увеличивает базовый доход с каждого нажатия.',
      pets: 'Ветка «Питомцы»: весёлые спутники фармят монеты сами каждую секунду.',
      luck: 'Ветка «Удача и буст»: повышает шанс крита, силу крита и общий множитель.'
    };

    const UPGRADES = [
      // Ветка 1: Сила клика
      { id: 'glove', branch: 'click', icon: '🥊', name: 'Боксёрская перчатка', desc: '+2 к силе клика', baseCost: 15, scale: 1.55, clickAdd: 2 },
      { id: 'hammer', branch: 'click', icon: '🔨', name: 'Игрушечный молот', desc: '+12 к силе клика', baseCost: 120, scale: 1.6, clickAdd: 12 },
      { id: 'rocket', branch: 'click', icon: '🚀', name: 'Турбо-палец', desc: '+65 к силе клика', baseCost: 850, scale: 1.65, clickAdd: 65 },
      { id: 'crown', branch: 'click', icon: '👑', name: 'Корона Кликера', desc: '+320 к силе клика', baseCost: 4500, scale: 1.7, clickAdd: 320 },

      // Ветка 2: Питомцы (авто-доход)
      { id: 'slime', branch: 'pets', icon: '🟢', name: 'Желе-Слайм', desc: '+3 монет/сек', baseCost: 25, scale: 1.55, dpsAdd: 3 },
      { id: 'cat', branch: 'pets', icon: '🐱', name: 'Кото-Боб', desc: '+18 монет/сек', baseCost: 180, scale: 1.6, dpsAdd: 18 },
      { id: 'ufo', branch: 'pets', icon: '🛸', name: 'Мини-НЛО', desc: '+95 монет/сек', baseCost: 1100, scale: 1.65, dpsAdd: 95 },
      { id: 'dragon', branch: 'pets', icon: '🐲', name: 'Неоновый Дракон', desc: '+500 монет/сек', baseCost: 6000, scale: 1.7, dpsAdd: 500 },

      // Ветка 3: Удача и буст
      { id: 'critChance', branch: 'luck', icon: '🎯', name: 'Снайперский глаз', desc: '+4% к шансу крита (макс. 70%)', baseCost: 60, scale: 1.75, critChanceAdd: 0.04, maxLvl: 15 },
      { id: 'critPower', branch: 'luck', icon: '💥', name: 'Мега-Крит', desc: '+1.0x к силе крита', baseCost: 140, scale: 1.7, critMultAdd: 1.0 },
      { id: 'multiplier', branch: 'luck', icon: '✨', name: 'Радужный бафф', desc: '+25% ко всему доходу', baseCost: 500, scale: 1.85, multAdd: 0.25 }
    ];

    const SAVE_KEY = 'superPopClickerSave_v1';

    function defaultState() {
      const levels = {};
      UPGRADES.forEach(u => { levels[u.id] = 0; });
      return {
        coins: 0,
        rebirths: 0,
        feverCharge: 0,
        feverTimer: 0,
        levels
      };
    }

    let state = loadState();
    let activeTab = 'click';

    function loadState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        const base = defaultState();
        return {
          ...base,
          ...parsed,
          levels: { ...base.levels, ...(parsed.levels || {}) }
        };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function getUpgradeCost(upg) {
      const lvl = state.levels[upg.id] || 0;
      return Math.floor(upg.baseCost * Math.pow(upg.scale, lvl));
    }

    function getGlobalMultiplier() {
      const rebirthMult = 1 + state.rebirths * 1.5;
      const buffMult = 1 + (state.levels.multiplier || 0) * 0.25;
      const feverMult = state.feverTimer > 0 ? 2 : 1;
      return rebirthMult * buffMult * feverMult;
    }

    function getClickPower() {
      let base = 1;
      for (const u of UPGRADES) {
        if (u.clickAdd) base += (state.levels[u.id] || 0) * u.clickAdd;
      }
      return Math.round(base * getGlobalMultiplier());
    }

    function getDps() {
      let base = 0;
      for (const u of UPGRADES) {
        if (u.dpsAdd) base += (state.levels[u.id] || 0) * u.dpsAdd;
      }
      return Math.round(base * getGlobalMultiplier());
    }

    function getCritChance() {
      return Math.min(0.7, 0.1 + (state.levels.critChance || 0) * 0.04);
    }

    function getCritMult() {
      return 3 + (state.levels.critMult || 0) * 1.0;
    }

    function getRebirthCost() {
      return Math.floor(5000 * Math.pow(2.4, state.rebirths));
    }

    function formatNum(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return String(Math.floor(n));
    }

    const coinsEl = document.getElementById('coins');
    const dpsEl = document.getElementById('dps');
    const rebirthsEl = document.getElementById('rebirths');
    const critInfoEl = document.getElementById('critInfo');
    const perClickBadge = document.getElementById('perClickBadge');
    const feverGaugeBadge = document.getElementById('feverGaugeBadge');
    const feverBanner = document.getElementById('feverBanner');
    const mainBtn = document.getElementById('mainBtn');
    const phraseEl = document.getElementById('phrase');
    const rebirthBtn = document.getElementById('rebirthBtn');
    const resetBtn = document.getElementById('resetBtn');
    const arena = document.getElementById('arena');
    const upgradeList = document.getElementById('upgradeList');
    const branchDesc = document.getElementById('branchDesc');

    function spawnFloatingText(x, y, text, color) {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.color = color;
      arena.appendChild(el);
      setTimeout(() => el.remove(), 760);
    }

    mainBtn.addEventListener('pointerdown', (e) => {
      mainBtn.classList.remove('squish');
      mainBtn.classList.add('excited');
      void mainBtn.offsetWidth;
      mainBtn.classList.add('squish');

      setTimeout(() => {
        mainBtn.classList.remove('squish');
        mainBtn.classList.remove('excited');
      }, 130);

      let gain = getClickPower();
      const isCrit = Math.random() < getCritChance();
      if (isCrit) {
        gain = Math.round(gain * getCritMult());
      }

      state.coins += gain;

      if (state.feverTimer <= 0) {
        state.feverCharge = Math.min(100, state.feverCharge + 5);
        if (state.feverCharge >= 100) {
          state.feverCharge = 0;
          state.feverTimer = 8;
          phraseEl.textContent = '🔥 ЛИХОРАДКА АКТИВИРОВАНА! ЖМИ НА ВСЕ! 🔥';
        }
      }

      if (Math.random() < 0.25 && state.feverTimer <= 0) {
        phraseEl.textContent = PHRASES[Math.floor(Math.random() * PHRASES.length)];
      }

      const rect = arena.getBoundingClientRect();
      const fx = e.clientX - rect.left + (Math.random() * 24 - 12);
      const fy = e.clientY - rect.top - 10;
      spawnFloatingText(
        fx,
        fy,
        isCrit ? `💥 +${formatNum(gain)} КРИТ!` : `+${formatNum(gain)}`,
        isCrit ? '#ff3b8d' : '#ffd426'
      );

      render();
      saveState();
    });

    rebirthBtn.addEventListener('click', () => {
      const cost = getRebirthCost();
      if (state.coins < cost) return;
      state.rebirths += 1;
      state.coins = 0;
      state.feverCharge = 0;
      state.feverTimer = 0;
      UPGRADES.forEach(u => { state.levels[u.id] = 0; });
      phraseEl.textContent = `♻️ ПЕРЕРОЖДЕНИЕ №${state.rebirths}! Сила улетела в космос!`;
      render();
      saveState();
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm('Точно сбросить весь прогресс кликера?')) return;
      state = defaultState();
      phraseEl.textContent = 'Чистый лист! Погнали заново!';
      render();
      saveState();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        branchDesc.textContent = BRANCH_INFO[activeTab];
        renderUpgrades();
      });
    });

    function buyUpgrade(id) {
      const upg = UPGRADES.find(u => u.id === id);
      if (!upg) return;
      const lvl = state.levels[id] || 0;
      if (upg.maxLvl && lvl >= upg.maxLvl) return;
      const cost = getUpgradeCost(upg);
      if (state.coins < cost) return;

      state.coins -= cost;
      state.levels[id] = lvl + 1;
      render();
      saveState();
    }

    function renderUpgrades() {
      const items = UPGRADES.filter(u => u.branch === activeTab);
      upgradeList.innerHTML = '';

      for (const upg of items) {
        const lvl = state.levels[upg.id] || 0;
        const maxed = upg.maxLvl && lvl >= upg.maxLvl;
        const cost = getUpgradeCost(upg);
        const canAfford = !maxed && state.coins >= cost;

        const card = document.createElement('div');
        card.className = 'upg-card';
        card.innerHTML = `
          <div class="upg-left">
            <div class="upg-icon">${upg.icon}</div>
            <div>
              <div>
                <span class="upg-title">${upg.name}</span>
                <span class="upg-lvl">Ур. ${lvl}${upg.maxLvl ? '/' + upg.maxLvl : ''}</span>
              </div>
              <div class="upg-sub">${upg.desc}</div>
            </div>
          </div>
          <button class="btn-buy" ${canAfford ? '' : 'disabled'}>
            ${maxed ? 'МАКС' : '🪙 ' + formatNum(cost)}
          </button>
        `;

        card.querySelector('.btn-buy').addEventListener('click', () => buyUpgrade(upg.id));
        upgradeList.appendChild(card);
      }
    }

    function render() {
      coinsEl.textContent = formatNum(state.coins);
      dpsEl.textContent = formatNum(getDps());
      rebirthsEl.textContent = state.rebirths;
      critInfoEl.textContent = `${Math.round(getCritChance() * 100)}% · x${getCritMult().toFixed(1)}`;
      perClickBadge.textContent = `+${formatNum(getClickPower())} за клик`;

      if (state.feverTimer > 0) {
        feverBanner.classList.add('active');
        feverGaugeBadge.textContent = `🔥 Лихорадка: ${state.feverTimer.toFixed(1)}с`;
      } else {
        feverBanner.classList.remove('active');
        feverGaugeBadge.textContent = `Лихорадка: ${Math.floor(state.feverCharge)}%`;
      }

      const rebirthCost = getRebirthCost();
      rebirthBtn.disabled = state.coins < rebirthCost;
      rebirthBtn.textContent = `♻️ Перерождение (нужно ${formatNum(rebirthCost)})`;

      renderUpgrades();
    }

    let lastTick = performance.now();
    setInterval(() => {
      const now = performance.now();
      const dt = Math.min(0.5, (now - lastTick) / 1000);
      lastTick = now;

      let changed = false;
      if (state.feverTimer > 0) {
        state.feverTimer = Math.max(0, state.feverTimer - dt);
        changed = true;
      }

      const dps = getDps();
      if (dps > 0) {
        state.coins += dps * dt;
        changed = true;
      }

      if (changed) {
        coinsEl.textContent = formatNum(state.coins);
        dpsEl.textContent = formatNum(getDps());
        perClickBadge.textContent = `+${formatNum(getClickPower())} за клик`;
        if (state.feverTimer > 0) {
          feverBanner.classList.add('active');
          feverGaugeBadge.textContent = `🔥 Лихорадка: ${state.feverTimer.toFixed(1)}с`;
        } else {
          feverBanner.classList.remove('active');
          feverGaugeBadge.textContent = `Лихорадка: ${Math.floor(state.feverCharge)}%`;
        }
        const rebirthCost = getRebirthCost();
        rebirthBtn.disabled = state.coins < rebirthCost;
        rebirthBtn.textContent = `♻️ Перерождение (нужно ${formatNum(rebirthCost)})`;
      }
    }, 100);

    setInterval(saveState, 3000);
    render();
  </script>
</body>
</html>
